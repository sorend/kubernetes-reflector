name: Release

on:
  push:
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/sorend/kubernetes-reflector

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/reflector/go.mod

      - name: go test
        run: cd src/reflector && go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src/reflector
          file: src/reflector/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/reflector/go.mod

      - name: Build binaries
        run: |
          cd src/reflector
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o dist/reflector-linux-amd64 ./cmd/reflector
          GOOS=linux GOARCH=arm64 go build -ldflags="-w -s" -o dist/reflector-linux-arm64 ./cmd/reflector

      - name: Create GitHub release
        run: |
          gh release create ${{ github.ref_name }} \
            --generate-notes \
            src/reflector/dist/reflector-linux-amd64 \
            src/reflector/dist/reflector-linux-arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
